<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance NABLA</title>
<link rel="icon" href="icono.png">
<style>
  :root { --azul:#14325f; --naranja:#e8622c; --gris:#f3f4f6; --borde:#d9dce1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", Arial, sans-serif; font-size:13px; color:#1f2937; background:#fff; }
  header { background:var(--azul); color:#fff; padding:10px 12px; border-bottom:3px solid var(--naranja); }
  header h1 { margin:0; font-size:15px; font-weight:600; }
  header small { opacity:.8; }
  section { padding:10px 12px; border-bottom:1px solid var(--borde); }
  label { display:block; font-size:11px; color:#6b7280; margin:6px 0 2px; text-transform:uppercase; letter-spacing:.03em; }
  input[type=text], select { width:100%; padding:6px 8px; border:1px solid var(--borde); border-radius:4px; font-size:13px; }
  .fila { display:flex; gap:6px; margin-top:8px; }
  button { flex:1; padding:7px 8px; border:1px solid var(--azul); background:#fff; color:var(--azul); border-radius:4px;
           font-size:12px; font-weight:600; cursor:pointer; }
  button.prim { background:var(--azul); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #estado { font-size:12px; color:#374151; min-height:18px; }
  #estado.error { color:#b91c1c; }
  .sw { width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,.2); flex:none; }
  .leyenda .n { margin-left:auto; font-variant-numeric: tabular-nums; font-weight:600; }
  label.chk { display:flex; align-items:center; gap:6px; font-size:12.5px; color:#1f2937; text-transform:none; letter-spacing:0; margin:8px 0 2px; cursor:pointer; }
  .seg { display:flex; border:1px solid #14325f; border-radius:4px; overflow:hidden; }
  .seg button { flex:1; border-radius:0; padding:7px 4px; font-size:12px; background:#fff; color:#14325f; border:0; border-right:1px solid #14325f; cursor:pointer; font-weight:400; }
  .seg button:last-child { border-right:0; }
  .seg button.act { background:#14325f; color:#fff; font-weight:600; }
  .ayudaSec { font-size:11px; color:#6b7280; margin-top:3px; }
  .fecha { margin-top:8px; font-size:12.5px; color:#14325f; background:#eef2f8; border-left:3px solid #e8622c; padding:6px 8px; border-radius:3px; }
  .fecha:empty { display:none; }
  .fecha span { font-size:11px; color:#4b5563; }
  .tit { font-size:11px; font-weight:700; color:#14325f; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
  table.ley td, table.ley th { padding:3px 3px; }
  table.ley td:first-child { white-space:nowrap; }
  table.ley .sw { display:inline-block; vertical-align:-2px; margin-right:6px; }
  table.ley tr.vacia td { color:#9ca3af; }
  table.ley tr.tot td { font-weight:700; border-top:1px solid #9ca3af; border-bottom:none; }
  td.accs { white-space:nowrap; text-align:right; width:52px; }
  button.ico { flex:none; padding:2px 4px; margin-left:2px; line-height:0; border-color:#c7cdd6; }
  button.ico:hover { background:#eef2f8; border-color:#14325f; }
  .acum { display:flex; align-items:center; gap:6px; font-size:11.5px; margin:3px 0; }
  .acum .en { width:58px; }
  .acum .bar { flex:1; height:8px; background:#e5e7eb; border-radius:2px; overflow:hidden; }
  .acum .bar span { display:block; height:100%; }
  .acum .vl { width:150px; text-align:right; font-variant-numeric:tabular-nums; color:#374151; }
  .nota { font-size:11px; color:#6b7280; margin-top:8px; display:flex; align-items:center; gap:3px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; font-size:11px; color:#6b7280; border-bottom:1px solid var(--borde); padding:4px 3px; position:sticky; top:0; background:#fff; }
  td { padding:4px 2px; border-bottom:1px solid #eef0f3; font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align:center; }
  tr.click { cursor:pointer; } tr.click:hover { background:var(--gris); }
  .barra { display:flex; height:8px; border-radius:2px; overflow:hidden; min-width:36px; background:#e5e7eb; }
  .tablaWrap { max-height:340px; overflow:auto; }
  details summary { cursor:pointer; color:var(--azul); font-weight:600; }
  pre { white-space:pre-wrap; font-size:11px; background:var(--gris); padding:6px; border-radius:4px; max-height:240px; overflow:auto; }
  .cardEnv { border:1px solid var(--borde); border-left:4px solid #E8622C; border-radius:4px; padding:8px; background:#fffaf6; }
  .encEnv { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .encEnv select { width:auto; max-width:130px; font-size:12px; padding:3px 4px; }
  .numEnv { font-size:20px; font-weight:700; color:#E8622C; line-height:1.1; }
  .numEnv span { font-size:11px; font-weight:400; color:#6b7280; margin-left:6px; }
  .kpis { display:flex; gap:6px; margin-top:6px; }
  .kpis div { flex:1; background:#fff; border:1px solid #f1d9c9; border-radius:4px; padding:4px; text-align:center; }
  .kpis b { display:block; font-size:15px; color:#14325f; }
  .kpis span { font-size:10.5px; color:#6b7280; }
  td.fuera { color:#9ca3af; font-style:italic; }
  .scrollLey { max-height:300px; overflow:auto; }
  .aviso { font-size:11px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; padding:6px; border-radius:4px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>Avance de producción</h1>
  <small>NABLA Acero · seguimiento por marca · v1.16</small>
</header>

<section>
  <label for="proyecto">Proyecto</label>
  <input type="text" id="proyecto" placeholder="ej. 1256">
  <label for="fuente">Origen del avance</label>
  <select id="fuente">
    <option value="tc">Archivo en Trimble Connect (5.3.4-PRODUCCION)</option>
    <option value="sp">Lista de SharePoint (en línea)</option>
    <option value="csv">Archivo de mi computadora (CSV o Excel)</option>
  </select>
  <label for="orden">Orden de avance dentro de cada marca</label>
  <select id="orden">
    <option value="xy">X creciente, luego Y creciente</option>
    <option value="yx">Y creciente, luego X creciente</option>
    <option value="xy_">X decreciente, luego Y decreciente</option>
    <option value="yx_">Y decreciente, luego X decreciente</option>
    <option value="z">De abajo hacia arriba (Z), luego X</option>
  </select>
  <label>Colorear por</label>
  <input type="hidden" id="modoColor" value="etapa">
  <div class="seg" id="grupoModo">
    <button type="button" data-m="etapa">Etapa</button>
    <button type="button" data-m="envio">Envío</button>
  </div>
  <label>Piezas a mostrar</label>
  <input type="hidden" id="filtroSec" value="todo">
  <div class="seg" id="grupoSec">
    <button type="button" data-f="todo">Todas</button>
    <button type="button" data-f="sin">Est. principal</button>
    <button type="button" data-f="solo">Solo secundarios</button>
  </div>
  <div class="ayudaSec" id="txtSec"></div>
  <div id="cajaCSV" style="display:none">
    <label for="archivo">Archivo (CSV o Excel)</label>
    <input type="file" id="archivo" accept=".csv,.xlsx,.xlsm,.xls">
  </div>
  <div class="fila">
    <button class="prim" id="btnColorear">Colorear avance</button>
    <button id="btnReset">Quitar colores</button>
  </div>
  <div id="fechaAvance" class="fecha"></div>
  <div id="estado" style="margin-top:6px"></div>
</section>

<section id="secEnvio" style="display:none">
  <div class="cardEnv">
    <div class="encEnv">
      <div><div class="tit" id="titEnvio">Último envío</div><div class="numEnv" id="numEnvio"></div></div>
      <select id="selEnvio" title="Elegir otro envío"></select>
    </div>
    <div class="kpis" id="kpisEnvio"></div>
    <div class="fila" style="margin-top:6px">
      <button id="btnSelEnv">Seleccionar en el modelo</button>
      <button id="btnSoloEnv">Ver solo este envío</button>
    </div>
    <div class="tablaWrap" style="max-height:170px;margin-top:6px"><table><thead><tr><th>Marca</th><th class="num">Pzas</th><th class="num">Ton</th></tr></thead>
      <tbody id="cuerpoEnvio"></tbody></table></div>
  </div>
</section>

<section>
  <div class="leyenda" id="leyenda"></div>
</section>

<section>
  <input type="text" id="filtro" placeholder="Buscar marca…">
  <div class="tablaWrap" style="margin-top:6px">
    <table>
      <thead><tr id="encTabla"></tr></thead>
      <tbody id="cuerpo"></tbody>
    </table>
  </div>
  <div id="noEncontradas"></div>
</section>

<section>
  <details>
    <summary>Diagnóstico</summary>
    <p style="font-size:12px">Selecciona una pieza en el modelo y presiona el botón para ver en qué propiedad está su marca.</p>
    <button id="btnDiag">Ver propiedades de la selección</button>
    <pre id="diag"></pre>
  </details>
</section>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script src="msal-browser.min.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="config.js?v=1.16"></script>
<script src="logica.js?v=1.16"></script>
<script src="app.js?v=1.16"></script>
</body>
</html>
